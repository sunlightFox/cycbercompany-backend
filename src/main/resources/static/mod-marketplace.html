<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>创意工坊 · Agent Studio</title>
  <style>
    :root{color-scheme:light;--bg:#f5f5f2;--panel:#fff;--ink:#171a18;--muted:#707770;--line:#dedfd9;--blue:#2459c7;--dark:#202421}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI Variable","Noto Sans SC","Microsoft YaHei UI",sans-serif}button{font:inherit;cursor:pointer}
    .page{min-height:100vh;display:grid;grid-template-columns:68px 1fr}.rail{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;background:var(--dark);color:#d9ddd8}.mark{display:grid;place-items:center;width:38px;height:38px;margin-bottom:12px;border:1px solid #59605a;border-radius:6px;color:#fff;font-weight:700}.rail button{width:44px;height:42px;border:0;border-radius:5px;background:transparent;color:#b9c0ba}.rail button:hover,.rail button.active{background:#f2f4f0;color:var(--dark)}.spacer{flex:1}
    main{width:min(1100px,100%);margin:0 auto;padding:48px 34px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px}.kicker{color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.04em}.top h1{margin:8px 0 0;font-size:32px;line-height:1.15}.top p{max-width:640px;margin:10px 0 0;color:var(--muted)}.back{padding:9px 13px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.mod-card{padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.card-head{display:flex;gap:12px;align-items:center}.icon{display:grid;place-items:center;width:42px;height:42px;border-radius:7px;background:var(--dark);color:#c7ebcf;font-size:18px}.card-head h2{margin:0;font-size:17px}.version{color:var(--muted);font-size:12px}.desc{margin:14px 0;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.chip{padding:4px 7px;border-radius:4px;background:#eef1ec;color:#536057;font-size:11px}.install{width:100%;height:38px;border:1px solid var(--blue);border-radius:6px;background:var(--blue);color:#fff;font-weight:650}.install.done{border-color:#5e886b;background:#eaf3eb;color:#2e6540}.detail{display:grid;gap:6px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.empty{padding:36px;border:1px dashed var(--line);color:var(--muted);text-align:center}
    @media(max-width:700px){.page{display:block}.rail{display:none}main{padding:28px 16px}.top{align-items:start;flex-direction:column}.top h1{font-size:27px}}
  </style>
</head>
<body><div class="page"><nav class="rail"><div class="mark">AS</div><button type="button" onclick="location.href='/'">聊</button><button type="button" class="active">工</button><button type="button">忆</button><div class="spacer"></div><button type="button">设</button></nav><main><div class="top"><div><div class="kicker">CREATIVE WORKSHOP</div><h1>安装能被 Agent 调度的 Mod</h1><p>每个 Mod 都是一套 UI、能力、数据源和记忆的组合。安装后，平台负责在合适的任务里动态挂载它。</p></div><button class="back" type="button" onclick="location.href='/'">回到聊天</button></div><section class="grid" id="mods"><div class="empty">正在读取 Mod 清单…</div></section></main></div><script>
    async function load(){const r=await fetch('/api/v1/mods');const mods=await r.json();const el=document.getElementById('mods');el.innerHTML='';mods.forEach(mod=>{const card=document.createElement('article');card.className='mod-card';const caps=mod.capabilities||[];card.innerHTML='<div class="card-head"><div class="icon">▶</div><div><h2></h2><div class="version"></div></div></div><p class="desc"></p><div class="chips"></div><div class="detail"></div><button class="install" type="button"></button>';card.querySelector('h2').textContent=mod.name;card.querySelector('.version').textContent=mod.id+' · v'+mod.version;card.querySelector('.desc').textContent=mod.description;const chips=card.querySelector('.chips');caps.slice(0,5).forEach(cap=>{const chip=document.createElement('span');chip.className='chip';chip.textContent=cap.id;chips.appendChild(chip)});card.querySelector('.detail').textContent='界面 '+mod.surfaces.length+' 个 · 记忆 '+mod.memorySchemas.length+' 类 · 来源适配 '+mod.sourceAdapters.length+' 个';const btn=card.querySelector('.install');btn.textContent=mod.installed?'已安装':'安装 Mod';if(mod.installed)btn.classList.add('done');btn.onclick=async()=>{if(mod.installed)return;const response=await fetch('/api/v1/mods/'+encodeURIComponent(mod.id)+'/install',{method:'POST'});if(response.ok){mod.installed=true;btn.textContent='已安装';btn.classList.add('done')}};el.appendChild(card)})}load().catch(()=>{document.getElementById('mods').innerHTML='<div class="empty">暂时无法读取 Mod 清单</div>'});
  </script></body></html>
