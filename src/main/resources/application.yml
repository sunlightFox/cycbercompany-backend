spring:
  application:
    name: cycbercompany
  datasource:
    # A local data directory has one owning backend process. Allowing H2's
    # AUTO_SERVER mode here makes accidental second launches look supported,
    # but concurrent writers can corrupt the MVStore file.
    url: jdbc:h2:file:${APP_DATA_DIR:./data}/db/agent-studio;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    hikari:
      # A transient database outage must fail the affected operation, not hang
      # request threads indefinitely.
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}
  flyway:
    enabled: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    try-it-out-enabled: true
  group-configs:
    - group: core
      display-name: 01 Core - 会话、模型、Agent、工具
      paths-to-match:
        - /api/v1/conversations/**
        - /api/v1/models/**
        - /api/v1/agents/**
        - /api/v2/agents/**
        - /api/v2/memories/**
        - /api/v2/personas/**
        - /api/v1/tools/**
        - /api/v1/tool-approvals/**
        - /api/v1/approval-modes
        - /api/v1/execution-settings
    - group: runs
      display-name: 02 Runs - 编排、队列、SSE、评测
      paths-to-match:
        - /api/v1/runs/**
        - /api/v1/conversations/*/queue
        - /api/v1/conversations/*/runs
    - group: knowledge
      display-name: 03 Knowledge - 知识库和 RAG
      paths-to-match:
        - /api/v1/knowledge/**
        - /api/v1/knowledge-bases/**
        - /api/v1/knowledge-search
        - /api/v1/knowledge-settings
    - group: integrations
      display-name: 04 Integrations - Skill、MCP、搜索
      paths-to-match:
        - /api/v1/skills/**
        - /api/v1/skill-*/**
        - /api/v1/mcp-*/**
        - /api/v1/web-search
    - group: nodes
      display-name: 05 Nodes - 节点、Artifact、本机执行
      paths-to-match:
        - /api/v1/nodes/**
        - /api/v1/node/**
        - /api/v1/node-*/**
        - /api/v1/artifacts/**
        - /api/v1/local-executor/**

server:
  # 本地优先的安全默认值。远程部署必须显式修改，并通过启动安全校验。
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}

app:
  data-dir: ${APP_DATA_DIR:./data}
  security:
    mode: ${APP_SECURITY_MODE:LOCAL}
    api-token: ${AGENT_STUDIO_API_TOKEN:}
    tenant-id: ${APP_SECURITY_TENANT_ID:personal}
    user-id: ${APP_SECURITY_USER_ID:remote-owner}
  run:
    timeout-seconds: 120
  persistence:
    # Disabled by default: a transient database fault must not stop the entire service.
    # A supervised production deployment may explicitly enable it after configuring restart policy.
    watchdog-enabled: ${APP_PERSISTENCE_WATCHDOG_ENABLED:false}
    watchdog-interval-ms: ${APP_PERSISTENCE_WATCHDOG_INTERVAL_MS:30000}
    watchdog-failure-threshold: ${APP_PERSISTENCE_WATCHDOG_FAILURE_THRESHOLD:2}
    # H2 is single-writer. Fail a duplicate local backend immediately instead of waiting for Hikari.
    local-lock-enabled: ${APP_PERSISTENCE_LOCAL_LOCK_ENABLED:true}
  local-executor:
    # The backend owns one same-host in-process executor by default.
    enabled: ${APP_LOCAL_EXECUTOR_ENABLED:true}
    workspace: ${APP_LOCAL_EXECUTOR_WORKSPACE:${APP_DATA_DIR:./data}/workspace}
  demos:
    video:
      # Video Demo private runtime. The platform core never executes remote
      # DEX/JNI/JS source code and has no dependency on TVBox compatibility.
      runtime-endpoint: ${VIDEO_DEMO_RUNTIME_ENDPOINT:}
      # Shared secret for a non-loopback runtime deployment. Leave empty when
      # the Demo Worker remains bound to 127.0.0.1.
      runtime-token: ${VIDEO_DEMO_RUNTIME_TOKEN:}
      # Optional JSON argv array. The Video Demo starts this Worker lazily; no
      # shell command or remote download is performed by the platform core.
      runtime-command: ${VIDEO_DEMO_RUNTIME_COMMAND:}
      runtime-working-directory: ${VIDEO_DEMO_RUNTIME_WORKING_DIRECTORY:}
  execution:
    # Shared interactive deployments must not be switched to sandbox-only routing.
    # Dedicated evaluation backends opt in explicitly with this environment variable.
    allow-nodes-only: ${APP_EXECUTION_ALLOW_NODES_ONLY:false}
  web-search:
    enabled: ${WEB_SEARCH_ENABLED:true}
    max-results: ${WEB_SEARCH_MAX_RESULTS:5}
    # Online search is served exclusively by Tavily; no local fallback is used.
    tavily-endpoint: ${TAVILY_ENDPOINT:https://api.tavily.com/search}
    tavily-api-key: ${TAVILY_API_KEY:}
    per-domain-limit: ${WEB_SEARCH_PER_DOMAIN_LIMIT:2}
    min-unique-domains: ${WEB_SEARCH_MIN_UNIQUE_DOMAINS:3}
    planning:
      max-queries: ${WEB_SEARCH_MAX_QUERIES:3}
      cache-ttl-seconds: ${WEB_SEARCH_CACHE_TTL_SECONDS:90}
    page-reader:
      enabled: ${WEB_SEARCH_PAGE_READER_ENABLED:true}
      max-results: ${WEB_SEARCH_PAGE_READER_MAX_RESULTS:8}
      max-excerpt-chars: ${WEB_SEARCH_PAGE_READER_MAX_EXCERPT_CHARS:1500}
      max-response-bytes: ${WEB_SEARCH_PAGE_READER_MAX_RESPONSE_BYTES:1000000}
      allow-private-hosts: ${WEB_SEARCH_PAGE_READER_ALLOW_PRIVATE_HOSTS:false}
  skills:
    install-dir: ${SKILL_INSTALL_DIR:${APP_DATA_DIR:./data}/skills}
    max-archive-bytes: ${SKILL_MAX_ARCHIVE_BYTES:15728640}
    max-files: ${SKILL_MAX_FILES:300}
    max-file-bytes: ${SKILL_MAX_FILE_BYTES:1048576}
  mcp:
    config-dir: ${MCP_CONFIG_DIR:${APP_DATA_DIR:./data}/mcp-connections}
  nodes:
    websocket:
      buffer-configured: ${APP_NODES_WEBSOCKET_BUFFER_CONFIGURED:true}
    browser:
      # 默认禁止浏览器访问本机和私网。仅本机联调时才精确配置，例如 localhost,127.0.0.1。
      allowed-private-hosts: ${APP_NODES_BROWSER_ALLOWED_PRIVATE_HOSTS:}
      max-url-length: ${APP_NODES_BROWSER_MAX_URL_LENGTH:4096}
  rag:
    embedding-enabled: ${RAG_EMBEDDING_ENABLED:false}
    embedding-model-profile-id: ${RAG_EMBEDDING_MODEL_PROFILE_ID:}
    max-embedding-chars: ${RAG_MAX_EMBEDDING_CHARS:6000}
    # Relative vector-channel weight during Reciprocal Rank Fusion. 1.0 keeps
    # lexical and semantic retrieval equally influential by default.
    vector-weight: ${RAG_VECTOR_WEIGHT:1.0}
  ai:
    default-model-profile-id: minimax-m3
    seed-default-profile: true
    default-profile:
      id: minimax-m3
      provider-type: OPENAI_COMPATIBLE
      base-url: ${EDGEFN_BASE_URL:https://api.edgefn.net/v1}
      model-name: ${EDGEFN_MODEL:MiniMax-M3}
      credential-ref: EDGEFN_API_KEY
      capabilities:
        - TEXT
        - JSON_OUTPUT
        - TOOLS

---
# Container and cloud deployments use this profile. Keep it separate from the
# local H2 defaults so local development remains zero-configuration.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/agent_studio}
    username: ${SPRING_DATASOURCE_USERNAME:agent_studio}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}
      validation-timeout: 5000
  h2:
    console:
      enabled: false
  flyway:
    # The project has no versioned schema yet. Hibernate creates the initial
    # schema; introduce Flyway migrations before any schema-changing release.
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update

app:
  persistence:
    local-lock-enabled: false
