spring:
  datasource:
    url: jdbc:h2:mem:agent-studio-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  security:
    mode: LOCAL
    api-token: ""
    tenant-id: test
    user-id: test-user
  nodes:
    websocket:
      buffer-configured: false
    browser:
      allowed-private-hosts: []
      max-url-length: 4096
