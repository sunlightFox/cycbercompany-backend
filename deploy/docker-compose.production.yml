services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cycbercompany}
      POSTGRES_USER: ${POSTGRES_USER:-cycbercompany}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - studio

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    image: cycbercompany/backend:latest
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8080
      APP_DATA_DIR: /data
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cycbercompany}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cycbercompany}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      H2_CONSOLE_ENABLED: "false"
      EDGEFN_API_KEY: ${EDGEFN_API_KEY:?Set EDGEFN_API_KEY in .env}
      EDGEFN_BASE_URL: ${A6API_BASE_URL:-https://a6api.com/v1}
      EDGEFN_MODEL: ${A6API_MODEL:-gpt-5.6-luna}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - backend-data:/data
    ports:
      - "5173:5173"
      - "127.0.0.1:8080:8080"
    networks:
      - studio

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.vite-web
    image: cycbercompany/frontend:latest
    restart: unless-stopped
    network_mode: service:backend
    depends_on:
      backend:
        condition: service_started

  workspace-node:
    profiles: ["local-executor"]
    build:
      context: ./backend
      dockerfile: ../Dockerfile.workspace-node
    image: cycbercompany/workspace-node:latest
    restart: unless-stopped
    command: ["start-local", "--server", "http://127.0.0.1:8080", "--workspace", "/workspace", "--name", "server-workspace"]
    network_mode: service:backend
    user: "0:0"
    environment:
      CYCBERCOMPANY_SKILL_RUNTIME: docker
    volumes:
      - /opt/cycbercompany/workspace:/workspace
      - node-config:/root/.cycbercompany-node
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - backend

volumes:
  postgres-data:
    name: cycbercompany_postgres-data
  backend-data:
    name: cycbercompany_backend-data
  node-config:
    name: cycbercompany_node-config

networks:
  studio:
    name: cycbercompany_studio
