services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: cycbercompany-backend
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: ${SERVER_ADDRESS:-0.0.0.0}
      EDGEFN_API_KEY: ${EDGEFN_API_KEY:-}
      EDGEFN_BASE_URL: ${EDGEFN_BASE_URL:-https://api.edgefn.net/v1}
      EDGEFN_MODEL: ${EDGEFN_MODEL:-MiniMax-M3}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # The frontend reverse proxy is the trusted local entry point in this
      # development topology; it forwards host-side bootstrap requests.
      APP_SECURITY_ALLOW_LOCAL_PROXY: ${APP_SECURITY_ALLOW_LOCAL_PROXY:-true}
    volumes:
      - backend-data:/app/data
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: cycbercompany-frontend
    restart: unless-stopped
    environment:
      CYCBERCOMPANY_API_URL: http://backend:8080
    ports:
      - "5173:3000"
    depends_on:
      - backend

  node:
    profiles: ["local-executor"]
    build:
      context: ./backend
      dockerfile: ../Dockerfile.node
    container_name: cycbercompany-node
    restart: unless-stopped
    environment:
      CYCBERCOMPANY_SKILL_RUNTIME: docker
    command: ["./bin/cycbercompany-node-java", "start-local", "--server", "http://127.0.0.1:8080", "--name", "server-workspace", "--workspace", "/workspace", "--config", "/root/.cycbercompany-node/local-executor.json"]
    network_mode: service:backend
    user: "0:0"
    volumes:
      - node-workspace:/workspace
      - node-data:/root/.cycbercompany-node
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - backend

volumes:
  backend-data:
  node-workspace:
  node-data:
